<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevate Workforce Solutions</title>
    <script>
        // Intelligent route resolver for static GitHub Pages hosting
        (function() {
            var path = window.location.pathname;
            var segments = path.split('/').filter(Boolean);
            var lastSegment = segments[segments.length - 1] || '';

            // Clean route mappings
            var routeMap = {
                'login': 'login.html',
                'admin-login': 'admin/login.html',
                'admin-dashboard': 'admin/dashboard.html',
                'register': 'register.html',
                'findajob': 'findajob.html',
                'jobs': 'findajob.html',
                'userdashboard': 'userdashboard.html',
                'dashboard': 'userdashboard.html',
                'applications': 'applications.html',
                'apply': 'apply.html',
                'profile': 'profile.html',
                'contact': 'contact.html',
                'admin': 'admin/login.html'
            };

            var clean = lastSegment.replace(/\.html$/, '').toLowerCase();
            if (routeMap[clean]) {
                var repoPrefix = segments.length > 1 && segments[0] === 'JobsPortal' ? '/JobsPortal/' : '/';
                window.location.replace(repoPrefix + routeMap[clean] + window.location.search + window.location.hash);
            }
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="modern-style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 text-center" style="max-width: 520px; width: 100%;">
        <div class="mb-3">
            <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1 fs-6">404 Error</span>
        </div>
        <h2 class="fw-bold text-slate-900 mb-2">Page Not Found</h2>
        <p class="text-muted mb-4">The page or resource you requested is unavailable or has been relocated to a cleaner URL.</p>
        <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
            <a href="index.html" class="btn btn-primary rounded-pill px-4 py-2 fw-semibold">
                <i class="bi bi-house-door me-1"></i> Back to Homepage
            </a>
            <a href="findajob.html" class="btn btn-outline-primary rounded-pill px-4 py-2 fw-semibold">
                <i class="bi bi-search me-1"></i> Browse Jobs
            </a>
        </div>
    </div>
</body>
</html>
